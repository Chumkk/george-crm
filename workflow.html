 {id:'receipt',stage:3,role:'pm',title:'分次生成收款单',brief:'定金 / 尾款 / 全款，逐笔记录',kind:'可重复出单',trigger:'对应订单的收款待办处于待处理状态。',actions:['选择销售订单与收款类型，填写金额或比例、备注。','生成本次收款单，保留历史记录并累计金额。','每张收款单交财务在 FSC 绑定对应收款流水。','需要继续收款时再次出单；至少出单一次后可手动结束本环节。'],outcome:'系统按已记录收款累计比例判断是否生成备货待办。',note:'收款出单与 FSC 流水绑定分别处理。当前原型的 20% 判断读取 CRM 收款记录，未接入 FSC 回执。'},
 {id:'threshold',stage:3,role:'sys',title:'累计收款达到 20%？',brief:'达到 → 生成备货；不足 → 继续收款',kind:'条件分支',branch:'不足 20% → 返回 25 继续收款',trigger:'生成收款单后，系统更新累计收款比例。',actions:['以订单金额为基数，检查累计收款是否达到 20%。','达到阈值时生成备货待办；同一订单不重复生成。','不足 20% 时不生成备货待办，继续通过收款待办出单。'],outcome:'达到 20% 即进入备货链路，收款待办仍可继续处理。',note:'沿用现有原型规则：手动结束收款不是备货前置条件。未满 20% 时结束收款也不会生成备货待办。'},
 {id:'stockTodo',stage:3,role:'sys',title:'生成备货待办',brief:'关联销售订单，交给该品类 SM',kind:'自动待办',trigger:'该订单的累计收款达到或超过 20%。',actions:['关联项目、销售订单与品类。','向对应 SM 发起备货待办，同一订单避免重复发起。'],outcome:'SM 收到备货资料填写任务。'},
 {id:'stockInfo',stage:3,role:'sm',title:'提交备货信息',brief:'备货范围、特殊要求、计划日期与备注',kind:'履约交接',trigger:'该品类 SM 收到备货待办。',actions:['核对销售订单及备货范围。','填写备货要求、特殊说明、计划备货日期与备注。','提交备货信息，完成本条备货待办。'],outcome:'订单进入备货环节，进入后续履约协作。'},
 {id:'stockStatus',stage:3,role:'sys',title:'订单进入备货环节',brief:'报价与成单链路完成，衔接后续履约',kind:'本图终点',trigger:'SM 提交备货信息。',actions:['记录备货要求与处理结果。','后续生产、采购、仓储及物流按实际履约流程继续推进。'],outcome:'本次宣讲范围到备货交接结束。',note:'此处表示成单后的备货交接，不代表实物已出库或完成空间交付。'}
];
const DF9_FINANCE={id:'finance',stage:3,role:'finance',title:'FSC 绑定收款流水',brief:'财务为每张收款单分别匹配流水',kind:'外部系统协作',trigger:'PM 生成收款单，并有可核对的收款流水。',actions:['财务进入 FSC，按收款单逐笔查找并绑定对应流水。','核对收款单号、金额、订单与付款信息。','定金、尾款或全款的多张收款单分别核对，异常交回 PM 跟进。'],outcome:'完成该张收款单与流水的财务匹配。',note:'FSC 为外部操作节点。本原型未接入 FSC，也未以流水匹配回执控制备货；图中的 20% 规则沿用现有 CRM 原型。'};
const DF9={stage:'all',detail:null,presenting:false,returnFocus:null};
function df9Escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function df9Role(r,full=false){const [name,title]=DF9_ROLES[r];const label=full&&['pm','sm'].includes(r)?name+' · '+title:full&&r==='sys'?'CRM 自动':name;return `<span class="df9-role df9-role-${r}" title="${title}">${label}</span>`;}
function df9Number(node){return node.id==='finance'?'25 · 支线':String(DF9_NODES.indexOf(node)+1).padStart(2,'0');}
function df9Node(node,index){const n=df9Number(node);return `<div class="df9-cell" style="--c4:${index<4?index+1:8-index};--r4:${Math.floor(index/4)+1};--c2:${Math.floor(index/2)%2?2-index%2:index%2+1};--r2:${Math.floor(index/2)+1}"><button class="df9-node ${node.kind==='自动待办'||node.kind==='待办转换'?'df9-auto':''}" data-df9="detail" data-node="${node.id}" aria-haspopup="dialog"><span class="df9-node-top"><span class="df9-num">${n}</span>${df9Role(node.role,true)}</span><strong>${node.title}</strong><span class="df9-node-brief">${node.brief}</span><span class="df9-kind">${node.kind}<span aria-hidden="true">↗</span></span></button>${node.reject?`<div class="df9-reject"><span aria-hidden="true">↳</span>${node.reject}</div>`:''}${node.branch?`<button class="df9-return" data-df9="detail" data-node="receipt">↶ ${node.branch}</button>`:''}<span class="df9-arrow" aria-hidden="true">→</span>${node.reject||node.branch?`<span class="df9-edge-label">${node.reject?'确认':'达到'}</span>`:''}</div>`;}
function df9Revision(){return `<div class="df9-revision"><div class="df9-rule-label">确认后需要调整</div><div class="df9-revision-path"><span>客户联系 PM</span><i>→</i><span>SM 编辑同一草稿并重新提交</span><i>→</i><span>原确认失效</span><i>→</i><span>PM 群内提醒</span><i>→</i><span>客户重新确认</span></div><p>仅保存不撤销原确认。重新提交后，草稿报价待办恢复待处理，旧的待处理订单待办撤回；再次确认后生成有效订单待办。已绑定报价需走订单变更。</p></div>`;}
function df9Loop(stage,index){
 const tracks={0:['02 有设计需求','03 多次提交需求','分别生成设计待办'],1:['10 项目待办持续打开','11 按品类选 SM','12 发确认商机待办'],3:['24 收款待办持续打开','25 分次出收款单','财务逐笔匹配流水']};
 const track=tracks[index];
 return '<div class="df9-loop">'+(track?'<div class="df9-repeat-track"><b>↶ 可重复</b>'+track.map((t,i)=>'<span>'+t+'</span>'+(i<track.length-1?'<i>→</i>':'')).join('')+'<em>继续下一次 ↶</em></div>':'<b>保存 · 提交 · 确认</b>')+'<p>'+stage.loop+'</p></div>';
}

function df36CustomerBranch(nodes){const node=id=>df9Node(nodes.find(n=>n.id===id),0);return '<div class="df36-customer-flow"><div class="df36-entry">'+['createCustomer','customerTodo','needs'].map(node).join('')+'</div><div class="df36-paths"><section class="df36-path"><h3><span>是</span> 需要设计</h3><div class="df36-design-nodes">'+['designTodo','designReview','designHandoff'].map(node).join('')+'</div></section><section class="df36-path df36-direct"><h3><span>否</span> 无需设计</h3><div class="df36-direct-copy">'+df9Role('biz',true)+'<b>选择负责项目的 PM</b><p>提交即完成客户待办<br>客户需求与附件交接 PM，立项时补齐空间与品类</p><span class="df36-down">↓ 直接进入创建项目待办</span></div></section></div><div class="df36-merge"><span>两条路径汇合 ↓</span>'+node('createProjectTodo')+'</div></div>';}

function df9StageHtml(stage,index){const nodes=DF9_NODES.filter(n=>n.stage===index);return `<section class="df9-stage" aria-labelledby="df9Stage${index}"><header class="df9-stage-head"><span class="df9-stage-number">${stage.num}</span><div><h2 id="df9Stage${index}">${stage.title}</h2><p>${stage.sub}</p></div><span class="df9-stage-range">节点 ${stage.range}</span></header>${index===0?df36CustomerBranch(nodes):`<div class="df9-grid">${nodes.map(df9Node).join('')}</div>`}${df9Loop(stage,index)}${index===2?df9Revision():''}${index===3?`<div class="df9-finance"><span class="df9-finance-branch" aria-hidden="true">25 ↳</span><div><b>逐笔财务协作</b><p>每张收款单 → 财务在 FSC 绑定对应收款流水。与 CRM 的累计收款判断分开展示。</p></div><button data-df9="detail" data-node="finance">${df9Role('finance')}<span>查看 FSC 环节 ↗</span></button></div><div class="df9-threshold-note"><b>备货触发规则</b><span>累计收款达到 20% 即生成备货待办；不必等收款待办手动结束。未达到阈值时结束收款，也不会生成备货待办。</span></div>`:''}<footer class="df9-handoff"><span>${index===3?'✓':'↓'}</span>${stage.handoff}</footer></section>`;}
function df9Content(){const selected=DF9.stage==='all'?DF9_STAGES.map((s,i)=>[s,i]):[[DF9_STAGES[Number(DF9.stage)],Number(DF9.stage)]];return selected.map(([s,i])=>df9StageHtml(s,i)).join('');}
function df9Page(){DF9.detail=null;return `<div class="df9-page${DF9.presenting?' df9-presenting':''}" data-flow-stage="${DF9.stage}"><header class="df9-heading"><div><div class="df9-eyebrow">敬城 CRM <span>/</span> 流程宣讲</div><h1>待办驱动成单全流程</h1><p>从创建客户到订单备货，按阶段查看处理人、操作和交接结果。</p></div><div class="df9-tools"><button class="df9-button" data-df9="print">打印流程</button><button class="df9-button df9-button-primary" data-df9="present" aria-pressed="${DF9.presenting}">${DF9.presenting?'退出演示':'演示模式'}</button></div></header><nav class="df9-tabs" aria-label="选择宣讲阶段"><div class="df9-tab-list"><button data-df9="stage" data-stage="all" class="${DF9.stage==='all'?'active':''}" aria-pressed="${DF9.stage==='all'}">全流程</button>${DF9_STAGES.map((s,i)=>`<button data-df9="stage" data-stage="${i}" class="${DF9.stage===String(i)?'active':''}" aria-pressed="${DF9.stage===String(i)}"><small>${s.num}</small>${s.title}</button>`).join('')}</div><span>实线主流程 · 红色拒绝分支 · ↶ 可重复环节</span></nav><div class="df9-content">${df9Content()}</div><footer class="df9-page-foot"><b>敬城 CRM · 业务流程说明</b><span>FSC、SCRM 为外部协作环节；当前页面用于流程宣讲。备货阈值沿用现有原型的累计收款 20% 规则。</span></footer></div>`;}
function df9SetStage(value,root){DF9.stage=value;root.dataset.flowStage=value;root.querySelectorAll('[data-df9="stage"]').forEach(b=>{const active=b.dataset.stage===value;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});root.querySelector('.df9-content').innerHTML=df9Content();}
function df9CloseDetail(){const mask=document.getElementById('df9DetailMask');if(!mask)return;mask.remove();DF9.detail=null;document.querySelectorAll('[data-df9-inert]').forEach(el=>{el.inert=false;el.removeAttribute('data-df9-inert');});const previous=DF9.returnFocus;if(previous?.isConnected)previous.focus({preventScroll:true});}
function df9OpenDetail(id,opener){const node=id==='finance'?DF9_FINANCE:DF9_NODES.find(n=>n.id===id);if(!node)return;let mask=document.getElementById('df9DetailMask');if(!mask){DF9.returnFocus=opener||document.activeElement;mask=document.createElement('div');mask.id='df9DetailMask';mask.className='df9-detail-mask';document.body.append(mask);for(const el of document.body.children){if(el!==mask&&!el.inert&&!['SCRIPT','STYLE','LINK'].includes(el.tagName)){el.inert=true;el.setAttribute('data-df9-inert','');}}}DF9.detail=id;const index=DF9_NODES.indexOf(node),stage=DF9_STAGES[node.stage];mask.innerHTML=`<section class="df9-detail" role="dialog" aria-modal="true" aria-labelledby="df9DetailTitle" tabindex="-1"><header><div><small>${stage.num} / ${stage.title}</small><span>节点 ${df9Number(node)}</span></div><button class="df9-close" data-df9="close" aria-label="关闭节点说明">×</button></header><div class="df9-detail-body">${df9Role(node.role)}<h2 id="df9DetailTitle">${node.title}</h2><p class="df9-detail-sub">${node.brief}</p><dl><dt>何时进入</dt><dd>${node.trigger}</dd><dt>谁来处理</dt><dd>${DF9_ROLES[node.role][0]} · ${DF9_ROLES[node.role][1]}</dd></dl><h3>操作与交接</h3><ol>${node.actions.map(a=>`<li>${a}</li>`).join('')}</ol><div class="df9-result"><small>处理结果</small><p>${node.outcome}</p></div>${node.reject?`<div class="df9-detail-reject"><b>${node.reject}</b><p>记录拒绝原因，不创建该分支的下游事项。</p></div>`:''}${node.note?`<aside class="df9-detail-note"><b>宣讲提醒</b><p>${node.note}</p></aside>`:''}</div><footer><button class="df9-button" data-df9="previous" ${index<=0?'disabled':''}>← 上一节点</button><span>${index<0?'财务支线':`${index+1} / ${DF9_NODES.length}`}</span><button class="df9-button df9-button-primary" data-df9="next" ${index<0||index===DF9_NODES.length-1?'disabled':''}>下一节点 →</button></footer></section>`;mask.querySelector('.df9-close').focus();}
document.addEventListener('click',e=>{if(e.target.id==='df9DetailMask'){df9CloseDetail();return;}const b=e.target.closest('[data-df9]');if(!b)return;const action=b.dataset.df9,root=b.closest('.df9-page')||document.querySelector('.df9-page');if(action==='close'){df9CloseDetail();return;}if(action==='detail'){df9OpenDetail(b.dataset.node,b);return;}if(action==='next'||action==='previous'){const i=DF9_NODES.findIndex(n=>n.id===DF9.detail)+(action==='next'?1:-1);if(i>=0&&i<DF9_NODES.length)df9OpenDetail(DF9_NODES[i].id);return;}if(!root)return;if(action==='stage'){df9SetStage(b.dataset.stage,root);root.querySelector('.df9-tabs').scrollIntoView({block:'start',behavior:'auto'});return;}if(action==='jump'){const n=DF9_NODES.find(n=>n.id===b.dataset.node);df9SetStage(String(n.stage),root);const target=root.querySelector(`.df9-node[data-node="${n.id}"]`);target.scrollIntoView({block:'center',behavior:'smooth'});target.focus({preventScroll:true});return;}if(action==='present'){DF9.presenting=!DF9.presenting;root.classList.toggle('df9-presenting',DF9.presenting);b.textContent=DF9.presenting?'退出演示':'演示模式';b.setAttribute('aria-pressed',String(DF9.presenting));if(DF9.presenting)root.scrollTop=0;return;}if(action==='print'){const prior=DF9.stage;df9SetStage('all',root);document.body.classList.add('df9-printing');const restore=()=>{document.body.classList.remove('df9-printing');df9SetStage(prior,root);window.removeEventListener('afterprint',restore);};window.addEventListener('afterprint',restore);window.print();}});
window.addEventListener('keydown',e=>{const dialog=document.querySelector('#df9DetailMask .df9-detail');if(dialog){if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();df9CloseDetail();}else if(e.key==='Tab'){const focusable=[...dialog.querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===focusable.at(-1)){e.preventDefault();focusable[0].focus();}}return;}if(e.key==='Escape'&&DF9.presenting){const root=document.querySelector('.df9-presenting');root?.querySelector('[data-df9="present"]').click();}},true);
if(typeof RENDER!=='undefined'){RENDER.spaceFlow=df9Page;TAB_NAME.spaceFlow='空间报价流程';const group=V5_NAV.find(x=>x[0]==='方案与报价');if(group&&!group[1].some(x=>x[0]==='spaceFlow'))group[1].unshift(['spaceFlow','plan','空间报价流程']);v5SyncNav();}else{document.getElementById('dealFlowApp').innerHTML=df9Page();}
</script></body></html>
