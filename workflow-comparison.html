ection></main><script>(()=>{let zoom=1,fit=false;const svg=document.querySelector('.svg-holder svg'),axis=document.querySelector('.role-header svg');function apply(){if(fit)zoom=Math.max(.4,(document.documentElement.clientWidth-58)/svg.viewBox.baseVal.width);svg.style.width=svg.viewBox.baseVal.width*zoom+'px';svg.style.height=svg.viewBox.baseVal.height*zoom+'px';axis.style.width=svg.viewBox.baseVal.width*zoom+'px';axis.style.height=82*zoom+'px';document.documentElement.style.setProperty('--nav-height',document.querySelector('nav').offsetHeight+'px');document.querySelector('.zoom-readout').textContent=Math.round(zoom*100)+'%';}document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{fit=b.dataset.zoom==='fit';if(!fit)zoom=Math.max(.4,Math.min(2,zoom+(b.dataset.zoom==='in'?.1:-.1)));apply();});window.addEventListener('resize',apply);document.getElementById('print').onclick=()=>window.print();apply();requestAnimationFrame(apply);})();</script></body></html>
