<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>报价单编辑-英国-Wilton-2271 - CRM3.0客户管理系统</title>
<style>
:root,html[data-theme="green"]{
  --ink:#333;--muted:#666;--line:#e4e4e7;--primary:#86d920;--primary-2:#52c41a;--primary-ink:#389e0d;--primary-soft:#e6edde;
  --accent-head:#f3fbe9;--accent-line:#d9efb8;
  --sheet-line:#d4d4d4;--head:#f5f5f5;--sel:var(--primary);--sel-bg:color-mix(in srgb,var(--primary) 12%,#fff);
  --red:#f5222d;--orange:#fa8c16;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
html[data-theme="blue"]{
  --primary:#1677ff;--primary-2:#0958d9;--primary-ink:#0958d9;--primary-soft:#e6f4ff;
  --accent-head:#e6f4ff;--accent-line:#91caff;
}
html[data-theme="orange"]{
  --primary:#fa8c16;--primary-2:#d46b08;--primary-ink:#d46b08;--primary-soft:#fff7e6;
  --accent-head:#fff7e6;--accent-line:#ffd591;
}
html[data-theme="purple"]{
  --primary:#722ed1;--primary-2:#531dab;--primary-ink:#531dab;--primary-soft:#f9f0ff;
  --accent-head:#f9f0ff;--accent-line:#d3adf7;
}
html[data-theme="red"]{
  --primary:#f5222d;--primary-2:#cf1322;--primary-ink:#cf1322;--primary-soft:#fff1f0;
  --accent-head:#fff1f0;--accent-line:#ffa39e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--ink);font:13px/1.4 var(--font);background:#fff;overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:48px 1fr}
.top{display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:center;gap:8px;min-width:196px;padding-left:4px}
.brand .logo{width:22px;height:22px;border-radius:4px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font:800 11px/22px var(--font);text-align:center}
.brand .name{font-size:15px;font-weight:600}
.iconbtn{width:28px;height:28px;border:1px solid #e5e5e5;border-radius:4px;background:#fff;color:#666;display:inline-grid;place-items:center;padding:0}
.tabs{display:flex;align-items:center;flex:1;min-width:0;overflow:auto;gap:4px;height:36px}
.tab{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fafafa;font-size:12px;white-space:nowrap;color:#666}
.tab.on{background:var(--primary-soft);border-color:transparent;color:#333;font-weight:600}
.tab .x{color:#bbb;font-size:12px}
.right{display:flex;align-items:center;gap:8px;margin-left:auto}
.avatar{width:28px;height:28px;border-radius:4px;background:linear-gradient(135deg,#b7eb8f,#69c0ff)}
.body{display:grid;grid-template-columns:72px 1fr;min-height:0}
.rail{background:#f7f7f7;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px}
.rail-item{width:58px;height:56px;border:0;border-radius:6px;background:transparent;color:#666;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px}
.rail-item svg{width:20px;height:20px}
.rail-item.on{background:var(--primary-soft);color:#333;font-weight:700}
.workspace{display:flex;flex-direction:column;min-width:0;min-height:0;background:#f0f0f0}
.actionbar{height:40px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:8px;flex:none}
.actionbar .title{font-weight:600;margin-right:4px}
.btn{height:28px;padding:0 12px;border-radius:4px;border:1px solid #d9d9d9;background:#fff;color:#333}
.btn.green{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;min-width:72px}
.btn.green:hover{filter:brightness(.97)}
.btn.icon{width:28px;padding:0;display:inline-grid;place-items:center}
select.tpl{height:28px;border:1px solid #d9d9d9;border-radius:4px;padding:0 8px;background:#fff;min-width:88px}
.editor{flex:1;min-height:0;display:grid;grid-template-columns:1fr 540px}
.editor.wide{grid-template-columns:1fr 0}
.sheet{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff;border-right:1px solid var(--line)}
.ribbon{background:#fff;border-bottom:1px solid #eee;flex:none}
.rtabs{display:flex;align-items:center;height:28px;padding:0 8px;gap:2px;border-bottom:1px solid #f0f0f0}
.rtabs button{height:26px;padding:0 12px;border:0;background:transparent;color:#666;border-bottom:2px solid transparent}
.rtabs button.on{color:var(--primary);font-weight:600;border-bottom-color:var(--primary)}
.rtools{height:40px;display:flex;align-items:center;gap:2px;padding:0 8px;overflow:hidden}
.rtools .g{display:flex;align-items:center;gap:1px;padding:0 6px;border-right:1px solid #eee;height:28px}
.rtools button{width:24px;height:24px;border:0;border-radius:3px;background:transparent;color:#444;display:grid;place-items:center;padding:0}
.rtools button:hover{background:#f2f2f2}
.rtools button.textbtn{width:auto;padding:0 8px;font-size:12px}
.rtools select{height:22px;border:1px solid #ddd;border-radius:2px;background:#fff;font-size:12px}
.rtools .num{width:44px}
.rtools[hidden]{display:none}
.fx{height:28px;display:flex;align-items:center;border-top:1px solid #eee;border-bottom:1px solid var(--sheet-line);background:#fff;flex:none}
.fx .name{width:72px;height:100%;border-right:1px solid #eee;display:grid;place-items:center;font-size:12px;color:#555;background:#fafafa}
.fx .mark{width:28px;display:grid;place-items:center;color:#888;font-style:italic;font-family:Georgia,serif}
.fx input{flex:1;border:0;height:100%;outline:none;padding:0 8px}
.gridwrap{flex:1;min-height:0;overflow:auto;background:#fff;position:relative;user-select:none}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;min-width:100%}
.sheet th,.sheet td{border-right:1px solid var(--sheet-line);border-bottom:1px solid var(--sheet-line);height:22px;padding:0 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;vertical-align:middle}
.sheet thead th{background:#f3f3f3;font-weight:500;text-align:center;color:#555;height:20px}
.sheet .rh{position:sticky;left:0;z-index:2;background:#f3f3f3;text-align:center;color:#666;width:36px;min-width:36px;max-width:36px;padding:0;cursor:pointer}
.sheet thead .rh{z-index:4;cursor:pointer}
.sheet .col.on,.sheet .rh.on{background:var(--primary-soft);color:var(--primary-ink)}
.sheet td.sel{outline:2px solid var(--sel);outline-offset:-2px;background:var(--sel-bg);position:relative;z-index:1}
.sheet td.rng{background:var(--sel-bg)}
.sheet td.hdr{background:#f3f3f3;font-weight:600;text-align:center;white-space:pre-line;height:36px;line-height:1.2;font-size:11px;cursor:default}
.sheet tr.hdr-row td{background:#f3f3f3}
.sheet tr.hdr-row td.rh{color:#8c8c8c}
.sheet td.hdr.red{color:#f5222d}
.sheet td.lock{background:#f3f3f3}
.sheet tr.space td.space-merge{background:var(--primary-soft);color:var(--primary-ink);font-weight:700;text-align:left;padding:0 12px;letter-spacing:.04em}
.sheet tr.space td.space-merge.sel,.sheet tr.space td.space-merge.rng{background:color-mix(in srgb,var(--primary) 18%,#fff)}
.sheet tr.space td.space-merge input{width:100%;height:22px;border:0;outline:none;background:transparent;font:inherit;font-weight:700;color:var(--primary-ink)}
.gridwrap:focus{outline:none}
.sheet td.sku-miss{background:#fff1f0;color:#cf1322;font-weight:600}
.sheet td.sku-warn{background:#fff7e6;color:#d46b08;font-weight:600}
.sheet td.pic{text-align:center}
.sheet .thumb{width:18px;height:18px;border-radius:2px;display:inline-block;vertical-align:middle;background:#e8e8e8}
.sheet td.edit{padding:0}
.sheet td.edit input{width:100%;height:22px;border:0;outline:none;padding:0 4px;background:transparent;font:inherit}
.ctx{position:fixed;z-index:90;min-width:148px;padding:4px 0;background:#fff;border:1px solid #e5e5e5;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
.ctx.on{display:block}
.ctx button{display:block;width:100%;height:30px;border:0;background:transparent;text-align:left;padding:0 14px;color:#333}
.ctx button:hover{background:#f5f5f5}
.ctx button[disabled]{color:#bbb;cursor:default}
.ctx hr{margin:4px 0;border:0;border-top:1px solid #f0f0f0}
.sfoot{height:28px;background:#fff;border-top:1px solid var(--sheet-line);display:flex;align-items:center;padding:0 8px;flex:none}
.stab{height:22px;padding:0 14px;border:1px solid #ddd;border-bottom:0;border-radius:4px 4px 0 0;background:#fff;font-size:12px}
.stab.on{border-color:var(--primary);color:var(--primary)}
.sfoot .zoom{margin-left:auto;display:flex;align-items:center;gap:8px;color:#666;font-size:12px}
.sfoot input[type=range]{width:80px}
.pside{background:#fff;display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.editor.wide .pside{display:none}
.plist-view{flex:1;min-height:0;display:flex;flex-direction:column}
.psearch{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #f0f0f0}
.psearch .row{display:flex;gap:8px}
.psearch .qbox{position:relative;flex:1}
.psearch .qbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#bbb}
.psearch input{width:100%;height:32px;border:1px solid #e5e5e5;border-radius:6px;padding:0 10px 0 32px;background:#fafafa}
.psearch input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px var(--primary-soft)}
.psearch .btn{height:32px;font-size:12px;border-radius:6px;padding:0 10px;color:#555}
.pbody{flex:1;min-height:0;display:grid;grid-template-columns:118px 1fr}
.pside.cats-fold .pbody{grid-template-columns:0 1fr}
.pside.cats-fold .pcats{display:none}
.pcats{border-right:1px solid #f0f0f0;overflow:auto;background:#fafafa}
.pcats-h{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#333;font-size:12px;font-weight:600}
.pcats-h button{width:22px;height:22px;border:0;background:transparent;color:#999}
.pcats button.cat{display:flex;align-items:center;gap:8px;width:100%;height:36px;border:0;background:transparent;text-align:left;padding:0 10px;color:#555;font-size:12px}
.pcats button.cat svg{width:15px;height:15px;flex:none;opacity:.7}
.pcats button.cat .arr{margin-left:auto;color:#ccc;font-size:10px}
.pcats button.cat.on{background:#fff;color:var(--primary);font-weight:600}
.pcats button.cat.on svg{opacity:1;color:var(--primary)}
.pmain{min-width:0;display:flex;flex-direction:column;min-height:0}
.ptabs{height:36px;display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid #f3f3f3;flex:none}
.ptabs button{height:36px;border:0;background:transparent;color:#666;padding:0;position:relative}
.ptabs button.on{color:#333;font-weight:600}
.ptabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary);border-radius:1px}
.plist{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.pcard{border:1px solid #eee;border-radius:6px;overflow:hidden;background:#fff;cursor:pointer;position:relative}
.pcard:hover{border-color:var(--accent-line);box-shadow:0 4px 14px rgba(0,0,0,.04)}
.pcard .pic{height:104px;position:relative;background:#f3f4f6;display:grid;place-items:center}
.pcard .pic svg{width:72px;height:72px}
.pcard .badge{position:absolute;left:6px;top:6px;background:#fa8c16;color:#fff;font-size:10px;padding:1px 6px;border-radius:2px;font-weight:700}
.pcard .star{position:absolute;right:6px;top:6px;width:22px;height:22px;border:0;background:transparent;color:#cfcfcf;padding:0;display:grid;place-items:center}
.pcard .star.on{color:#faad14}
.pcard .meta{padding:8px 8px 10px}
.pcard .name{font-size:12px;font-weight:600;color:#333;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.pcard .sku{font-size:11px;color:#999;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .price{margin-top:6px;color:var(--primary);font-weight:700;font-size:13px}
.ppager{height:40px;border-top:1px solid #f0f0f0;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 12px;font-size:12px;color:#666;flex:none}
.ppager button{min-width:24px;height:24px;border:1px solid #e5e5e5;background:#fff;border-radius:4px;color:#555}
.ppager button.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.ppager .size{margin-left:8px;color:#888}
.fab{position:absolute;right:16px;bottom:52px;width:44px;height:44px;border:0;border-radius:50%;background:var(--primary);color:#fff;font-size:22px;box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 35%,transparent)}
.pdetail{display:none;position:absolute;inset:0;background:#fff;z-index:4;flex-direction:column}
.pdetail.on{display:flex}
.pd-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #f0f0f0;flex:none}
.pd-head .back{border:0;background:transparent;color:#333;font-size:14px;padding:0;display:inline-flex;align-items:center;gap:4px}
.pd-lang{margin-left:auto;display:flex;border:1px solid #eee;border-radius:14px;overflow:hidden}
.pd-lang button{height:24px;padding:0 10px;border:0;background:#fff;color:#888;font-size:11px}
.pd-lang button.on{background:#111;color:#fff}
.pd-body{flex:1;overflow:auto;padding:14px 16px 20px}
.pd-hero{display:grid;grid-template-columns:76px 1fr;gap:12px;margin-bottom:14px}
.pd-thumbs{display:flex;flex-direction:column;gap:8px}
.pd-thumbs button{width:76px;height:76px;border:1px solid #eee;border-radius:4px;background:#f6f6f6;padding:0;overflow:hidden}
.pd-thumbs button.on{border-color:#111}
.pd-thumbs button svg,.pd-main svg{width:100%;height:100%}
.pd-main{height:168px;border-radius:4px;background:#f6f6f6;display:grid;place-items:center}
.pd-main svg{width:140px;height:140px}
.pd-tag{display:flex;align-items:center;gap:8px;margin:8px 0 6px;font-size:12px;color:#888}
.pd-tag .badge{background:#fa8c16;color:#fff;font-size:10px;padding:1px 6px;border-radius:2px;font-weight:700}
.pd-tag .star{margin-left:auto;border:0;background:transparent;color:#cfcfcf}
.pd-tag .star.on{color:#faad14}
.pd-name{font-size:18px;font-weight:600;margin:0 0 6px}
.pd-sku{font-size:12px;color:#999;margin-bottom:8px}
.pd-price{font-size:22px;font-weight:700;color:#222;margin-bottom:16px}
.pd-sec{margin:0 0 14px}
.pd-sec h4{margin:0 0 8px;font-size:13px;color:#333;display:flex;align-items:center;gap:6px}
.pd-sec h4 i{width:3px;height:12px;background:var(--primary);border-radius:1px;display:inline-block}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips.three{grid-template-columns:1fr 1fr 1fr}
.chips button{min-height:34px;border:1px solid #e6e6e6;border-radius:4px;background:#fff;color:#333;padding:6px 10px}
.chips button.on{background:var(--primary-soft);border-color:var(--accent-line);color:var(--primary);font-weight:600}
.chips button[disabled]{color:#bbb;background:#fafafa}
.pd-space{width:100%;height:34px;border:1px solid #e6e6e6;border-radius:4px;padding:0 10px;background:#fff}
.pd-space[hidden],.pd-space-wrap[hidden],.pd-cover-wrap[hidden]{display:none}
.pd-foot{display:flex;gap:10px;padding:10px 12px;border-top:1px solid #f0f0f0;flex:none}
.pd-foot .ghost{min-width:88px;height:40px;border:1px solid #e5e5e5;border-radius:20px;background:#fff}
.pd-foot .add{flex:1;height:40px;border:0;border-radius:20px;background:var(--primary);color:#fff;font-weight:600}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.modal{width:680px;max-width:calc(100vw - 32px);background:#fff;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;max-height:86vh}
.m-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--accent-head);border-bottom:1px solid var(--accent-line)}
.m-head h3{margin:0;font-size:16px}
.m-body{padding:16px 20px;overflow:auto}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #f0f0f0}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sum .card{border:1px solid #f0f0f0;border-radius:4px;padding:10px 12px;background:#fafafa}
.sum .card.warn{background:#fff7e6;border-color:#ffe7ba}
.sum .card.bad{background:#fff1f0;border-color:#ffa39e}
.sum .k{font-size:12px;color:#888}
.sum .v{font-size:20px;font-weight:700;margin-top:2px}
.sec{margin-top:12px}
.sec h4{margin:0 0 8px;font-size:13px}
.lrow{display:grid;grid-template-columns:56px 1fr 168px 72px 52px;gap:8px;padding:7px 10px;border:1px solid #f0f0f0;border-top:0;align-items:center;cursor:pointer}
.lrow:first-child{border-top:1px solid #f0f0f0;background:#fafafa;color:#888;font-size:12px;cursor:default}
.lrow:hover{background:var(--primary-soft)}
.mark{display:inline-block;font-size:11px;padding:1px 6px;border-radius:2px;font-weight:600}
.mark.bad{background:#fff1f0;color:#cf1322}
.mark.warn{background:#fff7e6;color:#d46b08}
.hint{font-size:12px;color:#888;margin:10px 0 0}
.check{margin-right:auto;font-size:12px;color:#666;display:flex;align-items:center;gap:6px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:8px 14px;border-radius:4px;display:none;z-index:80}
.toast.on{display:block}
.warn-modal{width:520px}
.warn-lead{display:flex;gap:12px;align-items:flex-start}
.warn-ico{width:36px;height:36px;border-radius:50%;background:#fff7e6;color:#d48806;display:grid;place-items:center;font-size:20px;flex:none}
.warn-lead h4{margin:0 0 6px;font-size:15px}
.warn-lead p{margin:0;color:#666;font-size:13px}
.bad-skus{margin:12px 0 0;padding:8px 12px;background:#fff1f0;border:1px solid #ffa39e;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.8;color:#cf1322}
.batch-box{display:none;padding:8px;border-bottom:1px solid #f0f0f0;background:var(--primary-soft)}
.batch-box.on{display:block}
.batch-box textarea{width:100%;min-height:64px;border:1px solid #d9d9d9;border-radius:4px;padding:6px;resize:vertical;font:12px/1.5 ui-monospace,Consolas,monospace}
.batch-box .row{display:flex;gap:6px;margin-top:6px}
html.embed .app{grid-template-rows:1fr}
html.embed .top,html.embed .rail{display:none!important}
html.embed .body{grid-template-columns:1fr}
</style>
<script>
(function(){
  const p=new URLSearchParams(window.__CRM_QUERY||location.search);
  if(p.get('embed')==='1') document.documentElement.classList.add('embed');
  const list=['green','blue','orange','purple','red'];
  let t=p.get('theme');
  if(!t){ try{ t=localStorage.getItem('crm-theme'); }catch(e){} }
  document.documentElement.dataset.theme=list.includes(t)?t:'blue';

function colLetter(i){ return LETTERS[i]; }
function addr(r,c){ return colLetter(c) + r; }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function maxRow(){ return rows.length + 1; }
function isHeader(r){ return r===1; }
function dataOf(r){ return r>=2 ? rows[r-2] : null; }
function normRange(){
  return {
    r1:Math.min(range.r1, range.r2), r2:Math.max(range.r1, range.r2),
    c1:Math.min(range.c1, range.c2), c2:Math.max(range.c1, range.c2)
  };
}
function inRange(r,c){
  const x=normRange();
  return r>=x.r1 && r<=x.r2 && c>=x.c1 && c<=x.c2;
}
function setSel(r,c, extend){
  r=Math.max(1, Math.min(maxRow(), r));
  c=Math.max(0, Math.min(COLS.length-1, c));
  if (extend){ range.r2=r; range.c2=c; }
  else { sel={r,c}; range={r1:r,c1:c,r2:r,c2:c}; }
}
function pushHist(){

}
function undoEdit(){
  const prev=undoStack.pop(); if(!prev) return toast('没有可撤销的操作');

  const s=JSON.parse(prev); rows=s.rows; sel=s.sel; range=s.range; renderGrid();
}
function redoEdit(){
  const next=redoStack.pop(); if(!next) return toast('没有可重做的操作');
  undoStack.push(JSON.stringify({rows, sel, range}));
  const s=JSON.parse(next); rows=s.rows; sel=s.sel; range=s.range; renderGrid();
}
function skuStatus(sku){
  if (!sku) return '';
  const hit = CATALOG[sku];
  if (!hit) return 'miss';
  return hit.score ? 'ok' : 'warn';
}
function computeColWidths(){
  const wrap=document.getElementById('gridwrap');
  const avail=Math.max(480, (wrap&&wrap.clientWidth||960) - RH);
  const canvas=document.createElement('canvas').getContext('2d');
  canvas.font='600 11px '+getComputedStyle(document.body).fontFamily;
  const mins=COLS.map(c=>{
    const lines=String(c.label).split('\n');
    const tw=Math.max(...lines.map(l=>Math.ceil(canvas.measureText(l).width)));
    return Math.max(c.w, tw+18);
  });
  const sum=mins.reduce((a,b)=>a+b,0);
  colWidths=mins.slice();
  if (sum<avail) colWidths[colWidths.length-1]+=avail-sum;
  tablePixelWidth=Math.max(avail, sum)+RH;
}
function cellClass(r,c){
  const x=normRange();
  const active=sel.r===r && sel.c===c;
  const covered=inRange(r,c);
  return (active?'sel ':'')+(covered&&!active?'rng ':'');
}
function fxValue(){
  if (isHeader(sel.r)) return COLS[sel.c].label.replace(/\n/g,' ');
  const row=dataOf(sel.r); if(!row) return '';
  if (row.kind==='space') return row.type||row.space||'';
  return String(row[COLS[sel.c].key]??'');
}
function focusGrid(){
  const wrap=document.getElementById('gridwrap');
  if (document.activeElement && (document.activeElement.id==='cellEdit' || document.activeElement.id==='fxInput')) return;
  wrap.focus({preventScroll:true});
}
function paintSel(){
  const x=normRange();
  document.querySelectorAll('#grid td.sel, #grid td.rng').forEach(el=>el.classList.remove('sel','rng'));
  document.querySelectorAll('#grid .rh.on, #grid .col.on').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('#grid td[data-r]').forEach(td=>{
    const r=+td.dataset.r, c=+td.dataset.c;
    const space=td.hasAttribute('data-space');
    const hit=space ? (r>=x.r1 && r<=x.r2) : inRange(r,c);
    const active=sel.r===r && (space || sel.c===c);
    if (active) td.classList.add('sel');
    else if (hit) td.classList.add('rng');
  });
  document.querySelectorAll('#grid .rh[data-row]').forEach(el=>{
    const r=+el.dataset.row;
    if (r>=x.r1 && r<=x.r2) el.classList.add('on');
  });
  document.querySelectorAll('#grid thead th[data-col]').forEach(el=>{
    const c=+el.dataset.col;
    if (c>=x.c1 && c<=x.c2) el.classList.add('on');
  });
  const row=dataOf(sel.r);
  document.getElementById('cellName').textContent=row&&row.kind==='space' ? ('空间'+sel.r) : addr(sel.r, sel.c);
  if (document.activeElement && document.activeElement.id==='fxInput') return;
  document.getElementById('fxInput').value=fxValue();
  focusGrid();
}
function cw(i){ return `width:${colWidths[i]}px;min-width:${colWidths[i]}px;max-width:${colWidths[i]}px`; }
function renderGrid(){
  if (!colWidths.length || !tablePixelWidth) computeColWidths();
  const x=normRange();
  const cols=COLS.map((c,i)=>`<col style="${cw(i)}">`).join('');

  const headerRow=`<tr class="hdr-row">
    <td class="rh ${sel.r===1?'on':''}" data-row="1" style="width:${RH}px;min-width:${RH}px;max-width:${RH}px">1</td>
    ${COLS.map((c,i)=>`<td class="hdr lock ${c.red?'red':''} ${cellClass(1,i)}" data-r="1" data-c="${i}" style="${cw(i)}">${c.label.replace(/\n/g,'<br>')}</td>`).join('')}
  </tr>`;
  const body=rows.map((row, idx)=>{
    const r=idx+2;
    const st=skuStatus(row.sku);
    const skuCls=colorOn && st==='miss' ? 'sku-miss' : '';
    if (row.kind==='space'){
      const name=row.type||row.space||'';
      const edit=editing && editing.r===r;
      return `<tr class="space">
        <td class="rh ${r>=x.r1&&r<=x.r2?'on':''}" data-row="${r}" style="width:${RH}px;min-width:${RH}px;max-width:${RH}px">${r}</td>
        ${edit
          ? `<td class="space-merge edit ${cellClass(r,0)}" colspan="${COLS.length}" data-r="${r}" data-c="0" data-space="1"><input id="cellEdit" value="${esc(name)}" /></td>`
          : `<td class="space-merge ${cellClass(r,0)}" colspan="${COLS.length}" data-r="${r}" data-c="0" data-space="1">${esc(name)}</td>`}
      </tr>`;
    }
    return `<tr>
      <td class="rh ${r>=x.r1&&r<=x.r2?'on':''}" data-row="${r}" style="width:${RH}px;min-width:${RH}px;max-width:${RH}px">${r}</td>
      ${COLS.map((c,i)=>{
        const edit=editing && editing.r===r && editing.c===i;
        const extra=(c.key==='sku'?skuCls:'')+(c.key==='pic'?' pic':'');
        let val=row[c.key]??'';
        if (c.key==='pic') val=row.pic?`<span class="thumb"></span>`:'';
        if (edit) return `<td class="edit ${cellClass(r,i)}" data-r="${r}" data-c="${i}" style="${cw(i)}"><input id="cellEdit" value="${esc(row[c.key]??'')}" /></td>`;
        return `<td class="${cellClass(r,i)}${extra}" data-r="${r}" data-c="${i}" style="${cw(i)}">${c.key==='pic'?val:esc(val)}</td>`;
      }).join('')}
    </tr>`;
  }).join('');
  const table=document.getElementById('grid');
  table.style.width=tablePixelWidth+'px';
  table.innerHTML=`<colgroup><col style="width:${RH}px">${cols}</colgroup><thead>${head}</thead><tbody>${headerRow}${body}</tbody>`;
  document.getElementById('cellName').textContent=addr(sel.r, sel.c);
  if (document.activeElement && document.activeElement.id==='fxInput') {/* keep */}
  else document.getElementById('fxInput').value=fxValue();
  if (editing){
    const inp=document.getElementById('cellEdit');
    if (inp){
      inp.focus();
      if (!editing.keep) inp.select();
      else { inp.selectionStart=inp.value.length; inp.selectionEnd=inp.value.length; }
      inp.onblur=commitEdit;
      inp.onkeydown=e=>{
        if (e.key==='Enter'){ e.preventDefault(); commitEdit(); setSel(Math.min(maxRow(), sel.r+1), sel.c); renderGrid(); }
        if (e.key==='Tab'){ e.preventDefault(); commitEdit(); setSel(sel.r, Math.min(COLS.length-1, sel.c+1)); renderGrid(); }
        if (e.key==='Escape'){ editing=null; renderGrid(); }
      };
    }
  }
}
function commitEdit(){
  const inp=document.getElementById('cellEdit');
  if (!inp || !editing){ editing=null; return; }
  if (isHeader(editing.r)){ editing=null; renderGrid(); return; }
  const row=dataOf(editing.r);
  const next=inp.value.trim();
  if (row){
    if (row.kind==='space'){
      if (String(row.type||row.space||'')!==next){
        pushHist();
        row.type=next; row.space=next;
      }
    } else {
      const key=COLS[editing.c].key;
      if (String(row[key]??'')!==next){
        pushHist();
        row[key]=next;
        if (key==='qty' || key==='price') recalcRow(row);
        renumber();
      }
    }
  }
  editing=null;
  renderGrid();
}
function recalcRow(row){
  const qty=Number(row.qty)||0, price=Number(String(row.price).replace(/,/g,''))||0;
  if (qty && price) row.amt=String(Math.round(qty*price)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function renumber(){
  let n=0;
  rows.forEach(r=>{
    if (r.kind==='space'){ n=0; r.no=''; }
    else if (r.sku || r.type || r.qty || r.price){ n+=1; r.no=n; }
    else r.no='';
  });
}
function canEdit(r){ return !isHeader(r); }
function startEdit(r,c, seed){
  if (!canEdit(r)){ toast('第 1 行是模板表头，已保护不可编辑'); return; }
  if (editing) commitEdit();
  const row=dataOf(r);
  const col=row&&row.kind==='space'?0:c;
  editing={r, c:col, keep:seed!=null};
  if (seed!=null && row){
    if (row.kind==='space'){ row.type=seed; row.space=seed; }
    else row[COLS[col].key]=seed;
  }
  renderGrid();
}
function hideCtx(){ document.getElementById('ctx').classList.remove('on'); }
function showCtx(x,y){
  const el=document.getElementById('ctx');
  el.classList.add('on');
  const w=el.offsetWidth, h=el.offsetHeight;
  el.style.left=Math.min(x, window.innerWidth-w-8)+'px';
  el.style.top=Math.min(y, window.innerHeight-h-8)+'px';
}
function selectedDataRows(){
  const x=normRange();
  const out=[];
  for (let r=Math.max(2,x.r1); r<=Math.min(maxRow(), x.r2); r++) out.push(r);
  return out;
}
function insertRows(where){
  const list=selectedDataRows();
  if (!list.length){
    pushHist();
    const space=dataOf(sel.r)?.space||'';
    rows.push(emptyRow(space));
    setSel(maxRow(), sel.c);
    renderGrid();
    return;
  }
  if (where==='above' && list[0]===1) return toast('不能在表头上方插入');
  pushHist();
  const space=dataOf(list[0])?.space||dataOf(list[list.length-1])?.space||'';
  const rec=emptyRow(space);
  if (where==='above') rows.splice(list[0]-2, 0, rec);
  else rows.splice(list[list.length-1]-1, 0, rec);
  const nr=where==='above'?list[0]:list[list.length-1]+1;
  setSel(nr, sel.c);
  renumber();
  renderGrid();
}
function insertSpaceRow(){
  const name=window.prompt('空间名称','新空间');
  if (name==null) return;
  const sp=name.trim()||'未确定空间';
  pushHist();
  const list=selectedDataRows();
  const at=list.length?list[list.length-1]-1:rows.length;
  rows.splice(at, 0, spaceRow(sp), emptyRow(sp));
  setSel(at+2, 1);
  renderGrid();
}
function deleteSelRows(){
  const list=selectedDataRows();
  if (!list.length) return toast('请先选择要删除的行');
  if (list.length===rows.length) return toast('至少保留一行');
  pushHist();
  const start=list[0]-2, count=list.length;
  rows.splice(start, count);
  if (!rows.length) rows.push(emptyRow());
  setSel(Math.min(maxRow(), Math.max(2, list[0])), sel.c);
  renumber();
  renderGrid();
}
function clearSel(){
  const x=normRange();
  if (x.r1===1 && x.r2===1) return toast('第 1 行是模板表头，已保护不可编辑');
  pushHist();
  for (let r=Math.max(2,x.r1); r<=Math.min(maxRow(),x.r2); r++){
    const row=dataOf(r); if (!row) continue;
    for (let c=x.c1; c<=x.c2; c++){
      const key=COLS[c].key;
      if (row.kind==='space' && (key==='type'||key==='space')) continue;
      row[key]='';
    }
  }
  renumber();
  renderGrid();
}
function copySel(){
  const x=normRange();
  const lines=[];
  for (let r=x.r1;r<=x.r2;r++){
    const cells=[];
    for (let c=x.c1;c<=x.c2;c++){
      cells.push(isHeader(r)? COLS[c].label.replace(/\n/g,' ') : (dataOf(r)?.[COLS[c].key]??''));
    }
    lines.push(cells.join('\t'));
  }
  clipboard=lines.join('\n');
  if (navigator.clipboard) navigator.clipboard.writeText(clipboard).catch(()=>{});
}
function pasteText(text){
  if (isHeader(sel.r)) return toast('第 1 行是模板表头，已保护不可编辑');
  const lines=String(text||'').replace(/\r/g,'').split('\n').filter((l,i,a)=>l||i<a.length-1);
  if (!lines.length) return;
  pushHist();
  lines.forEach((line,ri)=>{
    const cols=line.split('\t');
    let r=sel.r+ri;
    while (r>maxRow()) rows.push(emptyRow(dataOf(maxRow())?.space||''));
    const row=dataOf(r); if (!row || isHeader(r)) return;
    cols.forEach((val,ci)=>{
      const c=sel.c+ci; if (c>=COLS.length) return;
      row[COLS[c].key]=val;
    });
    recalcRow(row);
  });
  renumber();
  renderGrid();
}
function cellFromEvent(e){
  const td=e.target.closest('td[data-r]');
  if (td){
    if (td.hasAttribute('data-space')) return {r:+td.dataset.r, c:0, kind:'space'};
    return {r:+td.dataset.r, c:+td.dataset.c, kind:'cell'};
  }
  const rh=e.target.closest('[data-row]');
  if (rh) return {r:+rh.dataset.row, c:0, kind:'row'};
  const ch=e.target.closest('[data-col]');
  if (ch) return {r:1, c:+ch.dataset.col, kind:'col'};
  if (e.target.closest('[data-corner]')) return {r:1, c:0, kind:'all'};
  return null;
}

document.getElementById('gridwrap').addEventListener('mousedown', e => {

  hideCtx();
  const hit=cellFromEvent(e);
  if (!hit) return;
  if (e.target.id==='cellEdit' || e.target.closest('#cellEdit')) return;
  if (editing) commitEdit();
  const single=range.r1===range.r2 && range.c1===range.c2;
  const same=(hit.kind==='cell' && sel.r===hit.r && sel.c===hit.c && single)
    || (hit.kind==='space' && sel.r===hit.r && single);
  if (hit.kind==='all'){ setSel(1,0); range={r1:1,c1:0,r2:maxRow(),c2:COLS.length-1}; }
  else if (hit.kind==='row'){ setSel(hit.r, 0, e.shiftKey); range.c1=0; range.c2=COLS.length-1; if(!e.shiftKey){ range.r1=hit.r; range.r2=hit.r; sel={r:hit.r,c:0}; } }
  else if (hit.kind==='col'){ setSel(1, hit.c, e.shiftKey); range.r1=1; range.r2=maxRow(); if(!e.shiftKey){ range.c1=hit.c; range.c2=hit.c; sel={r:1,c:hit.c}; } }
  else if (hit.kind==='space'){ setSel(hit.r, 0, e.shiftKey); if(!e.shiftKey){ range={r1:hit.r,c1:0,r2:hit.r,c2:COLS.length-1}; sel={r:hit.r,c:0}; } }
  else setSel(hit.r, hit.c, e.shiftKey);
  pendingEdit = (e.button===0 && same && !e.shiftKey) ? {r:hit.r,c:hit.c} : null;
  dragging = e.button===0;
  dragMoved = false;
  dragMode = hit.kind;
  paintSel();
  e.preventDefault();
});
document.getElementById('gridwrap').addEventListener('mousemove', e => {
  if (!dragging) return;
  const hit=cellFromEvent(e); if (!hit) return;
  dragMoved=true; pendingEdit=null;
  if (dragMode==='row' || dragMode==='space'){ range.r2=hit.r; range.c1=0; range.c2=COLS.length-1; }
  else if (dragMode==='col'){ range.c2=hit.c; range.r1=1; range.r2=maxRow(); }
  else { range.r2=hit.r; range.c2=hit.c; }
  paintSel();
});
window.addEventListener('mouseup', ()=>{
  if (pendingEdit && !dragMoved) startEdit(pendingEdit.r, pendingEdit.c);
  pendingEdit=null; dragging=false; dragMode=''; dragMoved=false;
});
document.getElementById('gridwrap').addEventListener('dblclick', e => {

document.getElementById('gridwrap').addEventListener('contextmenu', e => {

document.addEventListener('keydown', e => {
  if (e.target.tagName==='SELECT' || e.target.tagName==='BUTTON' || e.target.tagName==='TEXTAREA' || (e.target.tagName==='INPUT' && e.target.id!=='fxInput' && e.target.id!=='cellEdit' )) {
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); quickSave(); }
    return;
  }
  if (e.target.id==='cellEdit') {
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); quickSave(); }
    return;
  }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); quickSave(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undoEdit(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redoEdit(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){ e.preventDefault(); copySel(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v'){
    e.preventDefault();
    if (navigator.clipboard&&navigator.clipboard.readText) navigator.clipboard.readText().then(pasteText).catch(()=>{if(clipboard)pasteText(clipboard);else toast('请允许浏览器读取剪贴板，或在单元格内粘贴');});
    else pasteText(clipboard);
    return;
  }
  if (e.target.id==='fxInput') return;
  const maxC=COLS.length-1;
  if (e.key==='ArrowRight'){ setSel(sel.r, sel.c+1, e.shiftKey); paintSel(); e.preventDefault(); }
  if (e.key==='ArrowLeft'){ setSel(sel.r, sel.c-1, e.shiftKey); paintSel(); e.preventDefault(); }
  if (e.key==='ArrowDown'){ setSel(sel.r+1, sel.c, e.shiftKey); paintSel(); e.preventDefault(); }
  if (e.key==='ArrowUp'){ setSel(sel.r-1, sel.c, e.shiftKey); paintSel(); e.preventDefault(); }
  if (e.key==='Enter'){ startEdit(sel.r, sel.c); e.preventDefault(); }
  if (e.key==='F2'){ startEdit(sel.r, sel.c); e.preventDefault(); }
  if (e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); clearSel(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='='){ e.preventDefault(); insertRows('below'); }
  if ((e.ctrlKey||e.metaKey) && e.key==='-'){ e.preventDefault(); deleteSelRows(); }
  if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length===1 && !e.isComposing){
    startEdit(sel.r, sel.c, e.key);
    e.preventDefault();
  }
});

function productNameOf(r){

function catOfRow(r){
  const t=String(r.type||''), sku=String(r.sku||'');
  if (/Stone|石/i.test(t)||/^ST-/.test(sku)) return '石材';
  if (/Light|灯/i.test(t)||/^(LT-|MTO-|ECO-)/.test(sku)) return '灯饰';
  if (/Bath|卫/i.test(t)||/^BA-/.test(sku)) return '卫浴';
  if (/Custom|定制/i.test(t)||/^(CUS-|DC-)/.test(sku)) return '定制';
  if (/Floor|地板/i.test(t)||/^FL-/.test(sku)) return '地板';
  return '家具';
}
function collectDraft(){
  const groups=[];
  let cur={name:'未确定空间', products:[]};
  rows.forEach(r=>{
    if (r.kind==='space'){
      groups.push(cur);
      cur={name:r.space||r.type||'未确定空间', products:[]};
      return;
    }
    if (!(r.sku || r.type || r.price || r.qty)) return;
    const amt=Number(String(r.amt).replace(/[^0-9.]/g,''))||Number(String(r.price).replace(/[^0-9.]/g,''))||0;
    const price=Number(String(r.price).replace(/[^0-9.]/g,''))||0;
    cur.products.push({name:productNameOf(r), cat:catOfRow(r), sku:r.sku||'', qty:r.qty||1, price, amt, type:r.type||''});
  });
  groups.push(cur);
  const nameEl=document.getElementById('draftName');
  const smEl=document.getElementById('draftSm');
  const tplEl=document.getElementById('tplSelect');
  return {
    todoId: PARAMS.get('todo')||'',
    project: PARAMS.get('project')||'',
    customer: PARAMS.get('customer')||'',
    name: nameEl?nameEl.value.trim():'',
    sm: smEl?smEl.value:'',
    tpl: tplEl?tplEl.value:'',
    draftCode: currentDraftCode || PARAMS.get('draft')||'',
    rows: rows.map(r=>({...r})),
    spaces: groups.filter(s=>s.products.length || (s.name && s.name!=='未确定空间'))
  };
}

function similarHits(code){
  const raw = String(code||'').toUpperCase();
  const all = Object.entries(CATALOG).map(([sku, info]) => ({sku, ...info}));
  return all.filter(p => {
    if (raw.includes('PAND') && p.sku.includes('PANDORA')) return true;
    if (raw.includes('MARBLE') && p.type === 'Stone') return true;
    if (raw.includes('ABC') || raw.includes('CUSTOM')) return p.type === 'Lighting' || p.type === 'Sofa';
    const head = raw.slice(0,3);
    return head && p.sku.toUpperCase().includes(head);
  }).slice(0, 6);
}
function runBatchSearch(){
  const codes = document.getElementById('batchCodes').value.split(/\s+/).filter(Boolean);
  updateBatchBtn(codes.length);
  const map = new Map();
  codes.forEach(c => similarHits(c).forEach(p => map.set(p.sku, p)));
  similarFilter = [...map.values()];
  if (!similarFilter.length) similarFilter = Object.entries(CATALOG).slice(0,4).map(([sku, info]) => ({sku, ...info}));
  renderProducts();
}

function spaceNames(){

function currentList(){

function renderPager(total){

  let html='';

  for(let i=1;i<=Math.min(pages,5);i++) html+=`<button class="${i===prodPage?'on':''}" onclick="prodPage=${i};renderProducts()">${i}</button>`;
  if(pages>5) html+=`<span>… ${pages}</span>`;
  html+=`<span class="size">${PAGE_SIZE}条/页</span>`;
  document.getElementById('ppager').innerHTML=html;
}

function templateSkuRows(){

    .filter(r=>rows[r.i].kind!=='space' && r.sku);
}
function defaultCoverIndex(){

  const cur=list.find(x=>x.i===sel.r-2);

  const miss=list.find(x=>x.miss);
  return (miss||list[0]).i;
}

function applySize(rec, size){
  if(!size) return;
  if(size.dia) rec.dia=size.dia;
  if(size.len) rec.len=size.len;
  if(size.wid) rec.wid=size.wid;
  if(size.hei) rec.hei=size.hei;
  const s=String(size.label||'');
  const dia=s.match(/DIA\s*(\d+)/i);
  const h=s.match(/H\s*(\d+)/i);
  if(dia) rec.dia=+dia[1];
  if(h) rec.hei=+h[1];
}
function findInsertIndex(mode, space, coverIndex){
  const cur=dataOf(sel.r);
  if(mode==='sku'){
    if(coverIndex>=0 && rows[coverIndex] && rows[coverIndex].kind!=='space') return coverIndex;
    if(cur&&cur.kind!=='space'&&cur.sku) return sel.r-2;
    const miss=rows.findIndex(r=>r.kind!=='space' && skuStatus(r.sku)==='miss');
    return miss>=0?miss:-1;
  }
  if(mode==='range'){
    if(cur&&cur.kind==='space'){
      rows.splice(sel.r-1, 0, emptyRow(cur.space||space));
      return sel.r-1;
    }
    if(cur&&cur.kind!=='space'&&!cur.sku) return sel.r-2;
    rows.splice(sel.r-1, 0, emptyRow((cur&&cur.space)||space));
    return sel.r-1;
  }
  const start=rows.findIndex(r=>r.kind==='space' && (r.space===space||r.type===space));
  if(start>=0){
    for(let i=start+1;i<rows.length;i++){
      if(rows[i].kind==='space') break;
      if(!rows[i].sku) return i;
    }
    rows.splice(start+1, 0, emptyRow(space));
    return start+1;
  }
  const same=rows.findIndex(r=>r.kind!=='space' && r.space===space && !r.sku);
  if(same>=0) return same;
  const any=rows.findIndex(r=>r.kind!=='space' && !r.sku);
  if(any>=0) return any;
  rows.push(emptyRow(space));
  return rows.length-1;
}
function confirmAddQuote(){
  if(!detail) return;
  const coverEl=document.getElementById('pdCover');
  const coverIndex=coverEl?Number(coverEl.value):detail.coverIndex;
  if(detail.mode==='sku' && !(coverIndex>=0)) return toast('请先选择要覆盖的模板编码');
  addProduct(productOf(detail.sku)||detail, {
    mode:detail.mode,
    space:document.getElementById('pdSpace')?document.getElementById('pdSpace').value:detail.space,
    coverIndex,
    size:detail.sizes[detail.size],
    color:detail.colors[detail.color],
    mat:detail.mats[detail.mat]
  });
  if(detail){
    detail.coverIndex=defaultCoverIndex();
    const cover=document.getElementById('pdCover');
    if(cover) cover.innerHTML=coverOptionsHtml(detail.coverIndex);
  }
}
function addProduct(p, opt){
  opt=opt||{};
  const hit = Object.assign({type:'Product', score:!!p.score, price:p.price, name:p.name}, CATALOG[p.sku]||{});
  pushHist();
  const mode=opt.mode||(similarFilter.length?'sku':'space');
  let i = findInsertIndex(mode, opt.space || (dataOf(sel.r)||{}).space || spaceNames()[0] || '', opt.coverIndex);
  const space = (mode==='sku' && rows[i]?.space) || opt.space || (dataOf(sel.r)||{}).space || spaceNames()[0] || '';
  if(i<0){
    rows.push(emptyRow(space));
    i=rows.length-1;
  }
  const qty = Number(rows[i]?.qty)||1;
  const disc = 90;
  const lib = Number(hit.price||p.price)||0;
  const price = Math.round(lib*disc/100);
  const rec = Object.assign(emptyRow(space), {
    type: hit.type||'Product',
    sku: p.sku,
    pic: 1,
    len: hit.len??'',
    wid: hit.wid??'',
    hei: hit.hei??'',
    dia: hit.dia??'',
    mat: opt.mat||hit.mat||'',
    unit: hit.unit||rows[i]?.unit||'pc',
    qty,
    lib,
    disc,
    price,
    amt: String(price*qty),
    cbm: hit.cbm??'',
    wt: hit.wt??'',
    rmk: [space, opt.color].filter(Boolean).join(' · ')
  });
  applySize(rec, opt.size);
  if (i >= 0) rows[i] = rec; else { rows.push(rec); i = rows.length-1; }
  setSel(i+2, 2);
  renumber();
  renderGrid();
  const tip=mode==='sku'?'已按编码覆盖：':mode==='range'?'已按选区加入：':'已按空间加入：';
  toast(tip+(p.name||rec.type));
}
function applyPimsTheme(name){

  document.documentElement.dataset.theme=list.includes(name)?name:'blue';
}
function fillDraftMeta(d){

    sm.value=d.sm;
  }
  const selTpl=document.getElementById('tplSelect');
  if(selTpl&&d.tpl && [...selTpl.options].some(o=>o.value===d.tpl||o.text===d.tpl)) selTpl.value=d.tpl;
  if(d.customer){
    document.getElementById('editorTitle').textContent='线上编辑模板 · '+d.customer;
    document.title='报价单编辑-'+d.customer+' - CRM3.0客户管理系统';
  }
}
function loadDraft(d){

  fillDraftMeta(d);
  if(Array.isArray(d.rows)&&d.rows.length){
    rows=padTemplate(d.rows.map(r=>Object.assign(emptyRow(r.space), r)));
    renumber();
    computeColWidths();
    renderGrid();
  }
}
window.addEventListener('message', e=>{
  if(!e.data) return;
  if(e.data.type==='crmTheme') applyPimsTheme(e.data.theme);
  if(e.data.type==='pimsLoadDraft') loadDraft(e.data.draft);

/* Fill only unused spaces for a todo review; keep normal save, formula and submit validation. */
function edTodoDemoFill(event) {
  if (event.source !== parent || !event.data || event.data.type !== 'crmTodoDemoFill') return;
  if (!edContext.todoId || event.data.todoId !== edContext.todoId) return;
  if (editing) commitEdit();
  const category = event.data.category || E46.template.cat;
  const candidates = [...ED_SHARED.catalog, ...allProducts()].filter(p => (p.cat || p.type) === category && p.sku && Number.isFinite(Number(p.price)) && Number(p.price) >= 0);
  const product = candidates[0];
  if (!product) return toast('当前品类没有可用样品，请从产品库选品。');
  const groups = [];
  let current = null;
  for (const row of rows) {
    if (row.kind === 'space') { current = { name: row.type || row.space, used: false }; groups.push(current); }
    else if (current && (e46Active(row) || [row.qty, row.price, row.rmk].some(v => v !== '' && v != null && v !== 0))) current.used = true;
  }
  const targets = [...new Set(groups.filter(g => g.name && !g.used).map(g => g.name))];
  const sample = { ...product, discount: product.discount ?? 100, profit: product.profit ?? 30, lossRate: product.lossRate ?? 0, costPrice: product.costPrice ?? Number(product.price) };
  for (const space of targets) addProduct(sample, { mode: 'space', space, qty: 1 });
  toast(targets.length ? '已为 ' + targets.length + ' 个空白空间填入样品，请核对产品、数量与价格后手动提交。' : '已保留全部现有产品与输入，没有可填充的空白空间。');
}
window.addEventListener('message', edTodoDemoFill);

/* Retrying one submission must not create a second quotation history version. */
let edSubmissionAttempt = null;
function edSubmissionRequest(payload) {
  const signature = JSON.stringify(payload);
  if (!edSubmissionAttempt || edSubmissionAttempt.signature !== signature)
    edSubmissionAttempt = { signature, id: 'quote-submit-' + (globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + '-' + Math.random().toString(36).slice(2)) };
  return edSubmissionAttempt.id;
}
confirmSaved = function() {
  if (!edValidate()) return;
  const payload = collectDraft();
  if (!payload.name) { toast('请填写报价单名称'); document.getElementById('draftName').focus(); return; }
  if (!payload.project) { toast('请选择关联项目'); document.getElementById('edProject').focus(); return; }
  edPendingSignature = edSignature();
  if (parent !== window) {
    payload.submissionRequestId = edSubmissionRequest(payload);
    closeSaveForm();
    parent.postMessage({ type: 'pimsDraftSaved', ...payload }, '*');
  } else { quickSave(); closeSaveForm(); }
};
window.addEventListener('message', event => {
  if (event.source !== parent || event.data?.type !== 'pimsSaveAck' || !event.data.durable) return;
  if (event.data.submissionRequestId && event.data.submissionRequestId === edSubmissionAttempt?.id) edSubmissionAttempt = null;
});
